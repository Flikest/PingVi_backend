externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact: {}
  description: This is PingVi selective forwarding unit.
  termsOfService: http://swagger.io/terms/
  title: PingVi selective forwarding unit
  version: "1.0"
paths:
  /:
    delete:
      consumes:
      - application/json
      description: |-
        Permanently deletes the authenticated user's account.
        - Requires authentication
        - Deletes all user data (sessions, messages, etc.)
        - This action cannot be undone
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully"  example({"user_id":"123e4567-e89b-12d3-a456-426614174000"})
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid token"  example({"error":"invalid token"})
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error"  example({"error":"failed to delete
            user"})
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - sso
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload one or multiple files to the file storage system. Files can be uploaded to public or private buckets based on category.
        - Public buckets: avatar, emoji, sticker (accessible without authentication)
        - Private buckets: default and other categories (require temporary URL for access)
        - Maximum file size: 2GB per file
        - Prohibited extensions: .exe, .bat, .sh (security reasons)
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - collectionFormat: multi
        description: Files to upload (max 2GB per file)
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      - description: Category for file organization
        enum:
        - avatar
        - emoji
        - sticker
        - default
        example: '"avatar"'
        in: formData
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: "Returns array of file statuses\"\t\t\texample({\"files\":[{\"filename\":\"profile.jpg\",\"status\":\"success\",\"bucket\":\"public/avatar/123e4567-e89b-12d3-a456-426614174000.jpg\"}]})"
          schema:
            additionalProperties: true
            type: object
        "400":
          description: "File too large or prohibited type\"\t\t\texample({\"files\":[{\"filename\":\"virus.exe\",\"status\":\"failed\",\"error\":\"This
            type of file is prohibited for security reasons\"}]})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\t\t\t\t\t\texample({\"error\":\"failed
            to generate file ID\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload files to storage
      tags:
      - file-storage
    put:
      consumes:
      - application/json
      description: |-
        Updates the authenticated user's profile information.
        - Can update: name, email, avatar, etc.
        - Email update may require re-verification
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: User update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user
          schema:
            $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.User'
        "400":
          description: Invalid request"  example({"error":"invalid email format"})
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error"  example({"error":"failed to update
            user"})
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user information
      tags:
      - sso
  /{id}:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves user information by user ID.
        - Returns public user information
        - Does not return sensitive data (password hash, etc.)
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        example: '"123e4567-e89b-12d3-a456-426614174000"'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User information
          schema:
            $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.User'
        "400":
          description: Invalid user ID"  example({"error":"invalid user id"})
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found"  example({"error":"user not found"})
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error"  example({"error":"failed to get user"})
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - sso
  /2fa:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a 2FA (Two-Factor Authentication) code for the user.
        - Requires email and 2FA code
        - Returns tokens upon successful verification
      parameters:
      - description: 2FA verification data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.TwoFaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 2FA verified successfully with tokens
          schema:
            $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.LogInResponse'
        "400":
          description: Invalid code"  example({"error":"invalid 2FA code"})
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error"  example({"error":"failed to verify
            2FA"})
          schema:
            additionalProperties: true
            type: object
      summary: Verify 2FA code
      tags:
      - sso
  /channels:
    delete:
      consumes:
      - application/json
      description: |-
        Permanently deletes a channel and all associated data. Requires 'manage_channel' permission (permission[2] == '1').
        - Deletes: roles, topics, members, messages and the channel itself
        - System message will be sent to the channel
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: Channel ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.DeleteChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: "Channel ID\"\t\t\t\texample({\"channel_id\":\"123e4567-e89b-12d3-a456-426614174000\"})"
          schema:
            additionalProperties: true
            type: object
        "400":
          description: "Invalid request\"\t\t\texample({\"error\":\"invalid body\"})"
          schema:
            additionalProperties: true
            type: object
        "403":
          description: "Insufficient permissions\"\texample({\"error\":\"the user
            does not have enough rights\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\t\texample({\"error\":\"failed to
            delete channel\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a channel
      tags:
      - messenger-channels
    post:
      consumes:
      - application/json
      description: |-
        Creates a new channel with the authenticated user as owner. Automatically creates owner role, @everyone role, general topic and directory.
        - Channel types: public (anyone can join) or private (invite only)
        - Owner gets full permissions (111111)
        - System messages will be sent to the channel
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: Channel creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.CreateChannelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created channel
          schema:
            $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.Channel'
        "400":
          description: "Invalid request body or JWT\"\texample({\"error\":\"invalid
            body\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\t\t\texample({\"error\":\"failed to
            insert channel\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new channel
      tags:
      - messenger-channels
    put:
      consumes:
      - application/json
      description: |-
        Updates channel details. Requires 'manage_channel' permission (permission[2] == '1').
        - Can update: name, description, icon, visibility
        - System message will be sent to the channel
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: Channel update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.UpdateChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated channel
          schema:
            $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.Channel'
        "400":
          description: "Invalid request\"\t\t\texample({\"error\":\"invalid body\"})"
          schema:
            additionalProperties: true
            type: object
        "403":
          description: "Insufficient permissions\"\texample({\"error\":\"the user
            does not have enough rights\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\t\texample({\"error\":\"failed to
            update channel\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update channel information
      tags:
      - messenger-channels
  /channels/{user_id}:
    get:
      consumes:
