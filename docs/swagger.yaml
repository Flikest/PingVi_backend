          description: Updated topic
          schema:
            $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.Topic'
        "400":
          description: "Invalid request\"\t\texample({\"error\":\"invalid body\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\texample({\"error\":\"failed to update
            topic\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a topic
      tags:
      - messenger-topics
  /topics/{channel_id}:
    get:
      consumes:
      - application/json
      description: Retrieves all topics from a specific channel. User must be a member
        of the channel.
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: Channel ID
        example: '"123e4567-e89b-12d3-a456-426614174000"'
        in: path
        name: channel_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of topics
          schema:
            items:
              $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.Topic'
            type: array
        "400":
          description: "Invalid channel ID\"\texample({\"error\":\"invalid channel
            id\"})"
          schema:
            additionalProperties: true
            type: object
        "403":
          description: "Not a member\"\t\t\texample({\"error\":\"the user does not
            belong to this group\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\texample({\"error\":\"failed to get
            topics\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all topics in a channel
      tags:
      - messenger-topics
  /ws/{session_id}:
    get:
      consumes:
      - application/json
      description: |-
        Establishes a WebSocket connection for real-time messaging.
        - Requires session_id for authentication
        - Supports operations: switch_community, read, send, update, delete
        - Messages are broadcasted to all members of the chat
      parameters:
      - description: Session ID for authentication
        example: '"abc123def456"'
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: WebSocket connection upgraded
          schema:
            $ref: '#/definitions/github_com_gorilla_websocket.Conn'
        "400":
          description: "Invalid session ID\"\t\texample({\"error\":\"invalid session
            id\"})"
          schema:
            additionalProperties: true
            type: object
        "415":
          description: "Invalid content type\"\t\texample({\"error\":\"Content-Type
            must be application/json\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "WebSocket upgrade failed\"\texample({\"error\":\"WebSocket
            upgrade failed\"})"
          schema:
            additionalProperties: true
            type: object
      summary: WebSocket connection for real-time messaging
      tags:
      - messenger-websocket
  /ws/messages/{chat_id}:
    get:
      consumes:
      - application/json
      description: Retrieves all messages from a specific chat (channel, group, or
        personal chat).
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: Chat ID
        example: '"123e4567-e89b-12d3-a456-426614174000"'
        in: path
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of messages
          schema:
            items:
              $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.Message'
            type: array
        "400":
          description: "Invalid chat ID\"\t\texample({\"error\":\"invalid chat id\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\texample({\"error\":\"failed to get
            messages\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all messages from a chat
      tags:
      - messenger-websocket
  /ws/messages/clear:
    delete:
      consumes:
      - application/json
      description: Clears all messages from a specific chat. Requires appropriate
        permissions.
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: Chat ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.ClearMessage'
      produces:
      - application/json
      responses:
        "200":
          description: "Chat ID\"\t\t\t\texample({\"chat_id\":\"123e4567-e89b-12d3-a456-426614174000\"})"
          schema:
            additionalProperties: true
            type: object
        "400":
          description: "Invalid request\"\t\texample({\"error\":\"invalid body\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\texample({\"error\":\"failed to clear
            messages\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Clear all messages from a chat
      tags:
      - messenger-websocket
  /ws/preview/{link}:
    get:
      consumes:
      - application/json
      description: |-
        Fetches a preview for a given link. Supports internal PingVi links and external URLs.
        - Internal links: returns type and message
        - External links: fetches content type and returns preview
      parameters:
      - description: Bearer JWT token
        example: '"Bearer eyJhbGciOiJIUzI1NiIs..."'
        in: header
        name: Authorization
        required: true
        type: string
      - description: URL to preview
        example: '"https://example.com/image.jpg"'
        in: path
        name: link
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: "Link preview data\"\t\texample({\"type\":\"image\",\"message\":\"https://s3.amazonaws.com/public/emoji/standart/1F600.json\"})"
          schema:
            $ref: '#/definitions/github_com_Flikest_PingVi_backend_internal_delivery_dto.LinkPreviewResponse'
        "400":
          description: "Invalid URL\"\t\t\texample({\"error\":\"invalid url format\"})"
          schema:
            additionalProperties: true
            type: object
        "500":
          description: "Internal server error\"\texample({\"error\":\"failed to fetch
            preview\"})"
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get link preview
      tags:
      - messenger-websocket
securityDefinitions:
  BasicAuth:
