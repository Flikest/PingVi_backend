syntax = "proto3";

package user_info;

option go_package = "./gen/go/user_info";

service UserInfo {
    rpc GetUserNameByID (GetUserNameByIdRequest) returns (GetUserNameByIdResponse);
    rpc GetUserIDBySessionID (GetUserIDBySessionIDRequest) returns (GetUserIDBySessionIDResponse);
    rpc GetUsersByIds (GetUserByIDRequest) returns (GetUserByIDResponse);
}

message GetUserNameByIdRequest {
    string user_id = 1;
}

message GetUserNameByIdResponse {
    string name = 1;
}

message GetUserIDBySessionIDRequest {
    string session_id = 1;
}

message GetUserIDBySessionIDResponse {
    string user_id = 1;
}

message GetUserByIDRequest {
    repeated string user_ids = 1;
}

message GetUserByIDResponse {
    repeated UsersInfo users = 1;
}
message UsersInfo {
    string id = 1;
    string name = 2;
    repeated string avatar = 3;
}
