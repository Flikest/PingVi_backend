syntax = "proto3";

package file_storage;

option go_package = "./gen/go/file_storage";

service FileStorage {
    rpc IssueTemporaryURL (IssueTemporaryURLRequest) returns (IssueTemporaryURLResponse);
}

message IssueTemporaryURLRequest {
    repeated string links = 1;
}

message FileResult {
    string temporaryLink = 1;
    string error = 2;
}

message IssueTemporaryURLResponse {
    repeated FileResult results = 1;
}
